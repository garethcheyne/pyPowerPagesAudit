[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppaudit"
version = "0.1.0"
description = "Power Pages / Dataverse exposure audit: what can an unauthenticated visitor read, and why"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Gareth Cheyne" }]
keywords = ["power-pages", "dataverse", "security", "audit", "dynamics365"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["requests>=2.31", "xmltodict>=0.13"]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.0"]

[project.scripts]
ppaudit = "ppaudit.cli:main"

[project.urls]
Homepage = "https://github.com/garethcheyne/pyPowerPagesAudit"
Issues = "https://github.com/garethcheyne/pyPowerPagesAudit/issues"

[tool.setuptools]
packages = ["ppaudit"]

[tool.setuptools.package-data]
ppaudit = ["_img/*.svg"]

[tool.pytest.ini_options]
# Pinning testpaths stops a same-named package elsewhere on sys.path being collected.
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: hits the public internet; deselect with -m 'not network'"]
